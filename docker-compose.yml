services:
  sparkleimage:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Match the host user so bind-mounted output stays writable without
        # running the container as root.
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    image: sparkleimage:latest
    container_name: sparkleimage
    restart: unless-stopped
    # Reached through Nginx Proxy Manager on nginx-proxy-nw. The host port is
    # bound to localhost only, for checks from the server itself.
    ports:
      - "127.0.0.1:${SPARKLE_PORT:-7860}:7860"
    networks:
      - nginx-proxy-nw
    volumes:
      - ./data:/app/data
    environment:
      # Environment wins over the saved data/config.yaml; an empty value here
      # is ignored, so leaving one blank lets the Settings tab own it.
      - SPARKLE_COMFY__URL=${COMFY_URL:-}
      - SPARKLE_COMFY__API_KEY=${COMFY_API_KEY:-}
      - SPARKLE_IMAGE__BASE_URL=${IMAGE_API_URL:-https://nano-gpt.com/api/v1}
      - SPARKLE_IMAGE__API_KEY=${IMAGE_API_KEY:-}
      - SPARKLE_IMAGE__EDIT_MODEL=${EDIT_MODEL:-seedream-v4.5}
      - SPARKLE_UI__SERVER_NAME=0.0.0.0
      - SPARKLE_UI__SERVER_PORT=7860
      # Set both to require a login. Do this before exposing the app publicly.
      - SPARKLE_UI__AUTH_USERNAME=${AUTH_USERNAME:-}
      - SPARKLE_UI__AUTH_PASSWORD=${AUTH_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  nginx-proxy-nw:
    external: true
