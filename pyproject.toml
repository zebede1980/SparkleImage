[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkleimage"
version = "0.2.0"
description = "AI Photo Repair, Recovery & Enhancement Tool"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SparkleImage Team"}
]
keywords = ["ai", "image", "restoration", "photo", "repair", "enhancement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
]

dependencies = [
    "gradio>=5.0",
    "httpx>=0.27",
    "pillow>=10.0",
    # headless: no libGL/libSM/libXext needed in the runtime image.
    # Pinned below 5 because 5.x stopped bundling the Haar cascades that are
    # the fallback when the YuNet weights are absent.
    "opencv-python-headless>=4.9,<5",
    "pydantic>=2.0",
    # 2.2 is where YamlConfigSettingsSource arrives, which is what keeps
    # environment variables ranked above the saved config file.
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
sparkleimage = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
